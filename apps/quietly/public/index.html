<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4f3eb">
  <title>notes</title>
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main id="entry" class="entry">
    <form id="login-form" class="login-form" action="/api/login" method="post" novalidate hidden>
      <input id="password" type="password" name="password" aria-label="password"
        autocomplete="current-password" enterkeyhint="go" required>
    </form>
    <p id="entry-status" class="visually-hidden" role="status"></p>
  </main>

  <div id="wall" class="wall" hidden>
    <main class="wall-content">
      <div class="wall-actions">
        <div id="writer-actions" class="writer-actions" hidden>
          <div id="views" class="views" role="group" aria-label="filter notes">
            <button type="button" class="action" data-view="published" aria-pressed="true">published</button>
            <button type="button" class="action" data-view="draft" aria-pressed="false">drafts</button>
          </div>
          <button type="button" id="write" class="action emphasis">new note</button>
        </div>
        <button type="button" id="back" class="action" hidden>back to notes</button>
        <button type="button" id="logout" class="action sign-out">sign out</button>
      </div>

      <section id="timeline" aria-labelledby="wall-heading">
        <h1 id="wall-heading" class="visually-hidden" tabindex="-1">notes</h1>
        <p id="wall-status" class="message" role="status"></p>
        <div id="notes" class="note-list"></div>
      </section>

      <section id="editor" class="editor" aria-labelledby="editor-heading" hidden>
        <h1 id="editor-heading" class="visually-hidden" tabindex="-1">new note</h1>
        <form id="note-form" class="note-form">
          <input id="note-title" type="text" name="title" aria-label="title (optional)"
            placeholder="title" maxlength="120">

          <textarea id="note-body" name="body" aria-label="note" rows="8" maxlength="40000"
            placeholder="write something"></textarea>

          <div class="photo-actions">
            <input id="note-photo" class="visually-hidden" type="file" name="photo" accept="image/jpeg,image/png,image/webp">
            <label for="note-photo" class="action">add photo</label>
            <button type="button" id="remove-photo" class="action" hidden>remove photo</button>
          </div>
          <img id="photo-preview" class="photo-preview" alt="photo for this note" hidden>

          <p id="editor-status" class="message" role="status"></p>

          <div class="editor-actions">
            <button type="submit" id="publish" class="action emphasis">publish</button>
            <button type="button" id="save-draft" class="action">save draft</button>
            <button type="button" id="delete" class="action danger" hidden>delete note</button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <template id="note-template">
    <article class="note">
      <div class="note-header">
        <time></time>
        <button type="button" class="action note-edit" hidden>edit</button>
      </div>
      <h2 class="note-title"></h2>
      <p class="note-body"></p>
      <img class="note-photo" alt="photo attached to this note" loading="lazy" hidden>
    </article>
  </template>

  <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-copy">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-copy"></p>
      <div class="dialog-actions">
        <button value="cancel" class="action" autofocus>cancel</button>
        <button id="confirm-action" value="confirm" class="action emphasis">confirm</button>
      </div>
    </form>
  </dialog>
</body>
</html>
